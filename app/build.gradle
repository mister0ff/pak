apply plugin: 'com.android.application'

android {
    compileSdkVersion 35
    namespace 'uk.lgl.modmenu'

    defaultConfig {
        applicationId "uk.lgl.aimlab"
        minSdkVersion 23
        targetSdkVersion 28
        versionCode 2
        versionName "2.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { minifyEnabled false }
    }
}
