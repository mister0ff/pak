name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build (assembleDebug ou assembleRelease)"
        required: true
        default: "assembleDebug"
        type: choice
        options:
          - assembleDebug
          - assembleRelease

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project root
        id: root
        run: |
          GRADLEW=$(find . -maxdepth 3 -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            APP_GRADLE=$(grep -rl "com.android.application" --include="build.gradle" . | head -n 1)
            if [ -z "$APP_GRADLE" ]; then
              echo "Erro: nenhum projeto Android encontrado."
              exit 1
            fi
            DIR=$(dirname "$(dirname "$APP_GRADLE")")
          else
            DIR=$(dirname "$GRADLEW")
          fi
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto Android em: $DIR"

      - name: Set up JDK 17 (para sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android cmdline-tools manually
        run: |
          set -e
          CMDLINE_TOOLS_DIR="$ANDROID_SDK_ROOT/cmdline-tools"
          mkdir -p "$CMDLINE_TOOLS_DIR"
          if [ ! -d "$CMDLINE_TOOLS_DIR/latest" ]; then
            echo "Baixando commandlinetools..."
            curl -sSLo /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            mv /tmp/cmdline-tools-extract/cmdline-tools "$CMDLINE_TOOLS_DIR/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
          fi
          export PATH="$CMDLINE_TOOLS_DIR/latest/bin:$PATH"
          echo "$CMDLINE_TOOLS_DIR/latest/bin" >> "$GITHUB_PATH"
          sdkmanager --version

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3" \
            "ndk;21.0.6113669" \
            "cmake;3.22.1" 2>&1 | tail -n 30
          echo ""
          echo "=== Pacotes instalados ==="
          sdkmanager --list_installed 2>/dev/null | head -n 30

      - name: Set up JDK 11 (para build com AGP 4.1.3)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Ensure local.properties exists
        run: |
          PROJECT_DIR="${{ steps.root.outputs.project_dir }}"
          if [ ! -f "$PROJECT_DIR/local.properties" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"
          fi

      - name: Grant execute permission to gradlew
        run: |
          PROJECT_DIR="${{ steps.root.outputs.project_dir }}"
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Regenerate wrapper if invalid (Gradle 6.5)
        run: |
          PROJECT_DIR="${{ steps.root.outputs.project_dir }}"
          WRAPPER_JAR="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"
          WRAPPER_PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          INVALID=0
          if [ ! -s "$WRAPPER_JAR" ] || [ ! -f "$PROJECT_DIR/gradlew" ]; then
            INVALID=1
          elif [ -f "$WRAPPER_PROPS" ] && ! grep -q "gradle-6.5" "$WRAPPER_PROPS"; then
            INVALID=1
          fi
          if [ "$INVALID" = "1" ]; then
            echo "Baixando Gradle 6.5 e regenerando o wrapper..."
            cd "$PROJECT_DIR"
            curl -sSLo /tmp/gradle-6.5-bin.zip https://services.gradle.org/distributions/gradle-6.5-bin.zip
            unzip -q /tmp/gradle-6.5-bin.zip -d /tmp
            /tmp/gradle-6.5/bin/gradle wrapper --gradle-version 6.5 --distribution-type bin
            chmod +x ./gradlew
            cat gradle/wrapper/gradle-wrapper.properties
          else
            echo "Wrapper já é válido (Gradle 6.5)."
          fi

      - name: Build APK
        working-directory: ${{ steps.root.outputs.project_dir }}
        run: |
          TASK="${{ github.event.inputs.build_type || 'assembleDebug' }}"
          echo "Java version:"
          java -version
          echo "Executando tarefa: $TASK"
          ./gradlew "$TASK" --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ steps.root.outputs.project_dir }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
